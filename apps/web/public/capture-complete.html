<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Capture terminée | CaptureProof</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#173a30;background:#f5f8f4;color-scheme:light}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px}
    main{max-width:440px;width:100%;background:#fff;border:1px solid #d4e2d7;border-radius:20px;padding:38px 28px;text-align:center}
    .check{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 24px;border-radius:50%;font-size:30px;background:#e8f3e9;color:#195b47}
    .brand{font-size:13px;font-weight:650;letter-spacing:.03em;color:#536a59}h1{font-size:28px;margin:16px 0;line-height:1.2}p{line-height:1.65;font-size:16px}.hint{color:#52645a;font-size:14px;margin-top:26px}
  </style>
</head>
<body>
  <main data-testid="capture-complete" aria-labelledby="complete-title">
    <div class="check" aria-hidden="true">✓</div>
    <div class="brand">CaptureProof</div>
    <h1 id="complete-title">Capture terminée</h1>
    <p>Photos envoyées. Vous pouvez revenir sur votre ordinateur.</p>
    <p class="hint">Les photos et le reçu restent disponibles dans votre dossier sur l’ordinateur.</p>
    <p><strong>Vous pouvez fermer cet onglet.</strong></p>
  </main>
</body>
</html>
